name: Release BongoCat

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: bongocat-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build / ${{ matrix.platform }}
    if: github.repository == 'vladelaina/BongoCat'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
            cmake_arch: x64
          - os: windows-2022
            platform: windows-x86
            cmake_arch: Win32
          - os: ubuntu-latest
            platform: linux-x64
            cmake_arch: ''
          - os: macos-15-intel
            platform: macos-x64
            cmake_arch: x86_64
          - os: macos-15
            platform: macos-arm64
            cmake_arch: arm64
    env:
      CUBISM_SDK_ARCHIVE_URL: ${{ secrets.CUBISM_SDK_ARCHIVE_URL }}
      CUBISM_SDK_ARCHIVE_SHA256: ${{ secrets.CUBISM_SDK_ARCHIVE_SHA256 }}
      CUBISM_GLEW_ARCHIVE_URL: ${{ secrets.CUBISM_GLEW_ARCHIVE_URL }}
      CUBISM_GLEW_ARCHIVE_SHA256: ${{ secrets.CUBISM_GLEW_ARCHIVE_SHA256 }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Validate tag version
        id: version
        shell: pwsh
        run: |
          $projectVersion = & ./packaging/get-project-version.ps1
          $version = $projectVersion.AppVersion
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match project version $version"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT `
            -Append -Encoding utf8

      - name: Restore licensed Cubism SDK
        shell: pwsh
        run: ./.github/scripts/restore-cubism-sdk.ps1

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libgl1-mesa-dev libx11-dev libxi-dev \
            libxfixes-dev libcurl4-openssl-dev xvfb xauth libgl1-mesa-dri

      - name: Configure Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build-release -G "Visual Studio 17 2022" `
            -A ${{ matrix.cmake_arch }} -T v143 `
            -DBONGO_CAT_REQUIRE_CUBISM=ON `
            -DBONGO_CAT_WARNINGS_AS_ERRORS=ON

      - name: Configure Unix release
        if: runner.os != 'Windows'
        run: |
          cmake -S . -B build-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.cmake_arch }} \
            -DBONGO_CAT_REQUIRE_CUBISM=ON \
            -DBONGO_CAT_WARNINGS_AS_ERRORS=ON

      - name: Build Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          & ./.github/scripts/build-windows.ps1
          cmake --build build-release --config Release --parallel 2

      - name: Build Unix release
        if: runner.os != 'Windows'
        run: bash .github/scripts/build-unix.sh cmake --build build-release --parallel 2

      - name: Install software OpenGL for Windows tests
        if: runner.os == 'Windows'
        uses: ssciwr/setup-mesa-dist-win@6657792673a5d162d5f244db991ba45b4b68989f # v2
        with:
          version: '23.3.3'
          deployment-choice: '1'

      - name: Test Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          & ./.github/scripts/test-windows.ps1
          ctest --test-dir build-release -C Release --output-on-failure

      - name: Test Unix release
        if: runner.os != 'Windows'
        run: bash .github/scripts/test-unix.sh ctest --test-dir build-release --output-on-failure

      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            choco install nsis --no-progress --yes
          }
          $nsisCommand = Get-Command makensis.exe -ErrorAction SilentlyContinue
          $nsisRoots = @(
            (Join-Path ${env:ProgramFiles(x86)} 'NSIS'),
            (Join-Path $env:ProgramFiles 'NSIS')
          )
          if ($nsisCommand) { $nsisRoots += Split-Path $nsisCommand.Source }
          $nsisRoot = $nsisRoots | Where-Object {
            Test-Path -LiteralPath (Join-Path $_ 'makensis.exe')
          } | Select-Object -First 1
          if (-not $nsisRoot) {
            throw 'NSIS was not installed (makensis.exe was not found)'
          }
          $nsisRoot | Out-File -FilePath $env:GITHUB_PATH `
            -Append -Encoding utf8

      - name: Package Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = (Get-Content build-release/bongocat-package-name.txt -Raw).Trim()
          $expected = "BongoCat-${{ steps.version.outputs.version }}-${{ matrix.platform }}"
          if ($name -ne $expected) {
            throw "Unexpected release package name: $name"
          }

          cmake --build build-release --config Release --target package-portable
          if ($LASTEXITCODE -ne 0) {
            throw 'Windows portable packaging failed'
          }
          cmake --build build-release --config Release --target package-installer
          if ($LASTEXITCODE -ne 0) {
            throw 'Windows installer packaging failed'
          }

          $portable = "build-release/dist/$name-portable.exe"
          $portableChecksum = "$portable.sha256"
          $setup = "build-release/dist/$name-setup.exe"
          $setupChecksum = "$setup.sha256"
          foreach ($file in @($portable, $setup, $setupChecksum)) {
            if (-not (Test-Path -LiteralPath $file)) {
              throw "Release file is missing: $file"
            }
          }
          $portableHash = (Get-FileHash -LiteralPath $portable -Algorithm SHA256).Hash.ToLowerInvariant()
          "$portableHash  $([IO.Path]::GetFileName($portable))" |
            Set-Content -LiteralPath $portableChecksum -Encoding ascii

          New-Item -ItemType Directory -Path release-output -Force | Out-Null
          Copy-Item -LiteralPath $portable, $portableChecksum, $setup, `
            $setupChecksum -Destination release-output

      - name: Package Unix release
        if: runner.os != 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: |
          $name = (Get-Content build-release/bongocat-package-name.txt -Raw).Trim()
          $expected = "BongoCat-${{ steps.version.outputs.version }}-${{ matrix.platform }}"
          if ($name -ne $expected) {
            throw "Unexpected release package name: $name"
          }

          cmake --build build-release --target package
          if ($LASTEXITCODE -ne 0) {
            throw 'Unix archive packaging failed'
          }
          $archives = @(Get-ChildItem build-release/dist -File | Where-Object {
            $_.Name -match '\.(zip|tar\.gz)$'
          })
          if ($archives.Count -ne 1) {
            throw "Expected one Unix release archive, found $($archives.Count)"
          }
          $archive = $archives[0]
          $packageCheckArgs = @{
            Archive = $archive.FullName
            Platform = '${{ matrix.platform }}'
            SkipSmoke = '${{ matrix.platform }}'.StartsWith('macos-')
          }
          & ./.github/scripts/check-unix-package.ps1 @packageCheckArgs
          $checksum = "$($archive.FullName).sha256"
          if (-not (Test-Path -LiteralPath $checksum -PathType Leaf)) {
            throw "Release checksum is missing: $checksum"
          }

          New-Item -ItemType Directory -Path release-output -Force | Out-Null
          Copy-Item -LiteralPath $archive.FullName, $checksum `
            -Destination release-output

      - name: Upload packaged release
        uses: actions/upload-artifact@v7
        with:
          name: bongocat-release-${{ matrix.platform }}
          path: release-output/*
          if-no-files-found: error
          retention-days: 7

  virus-total:
    name: security / virustotal
    needs: build
    if: github.repository == 'vladelaina/BongoCat'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Download packaged releases
        uses: actions/download-artifact@v8
        with:
          pattern: bongocat-release-windows-*
          path: vt-input
          merge-multiple: true

      - name: Scan all Windows release artifacts with VirusTotal
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find vt-input -type f \( \
            -iname '*-setup.exe' -o -iname '*-portable.exe' \) \
            -print0 | sort -z)
          if [ "${#files[@]}" -ne 4 ]; then
            echo "::error::Expected 4 VirusTotal inputs, found ${#files[@]}"
            printf 'Found: %s\n' "${files[@]}"
            exit 1
          fi
          for file in "${files[@]}"; do
            report=$(basename "$file" | tr -c 'A-Za-z0-9._-' '_')
            VT_REPORT_PATH="virustotal-report-$report.json" \
              python3 .github/scripts/scan-virustotal.py --file "$file"
          done

      - name: Add VirusTotal note when scanning is skipped
        if: always() && hashFiles('virustotal-report-*.json') == ''
        run: |
          {
            echo "## VirusTotal scans"
            echo
            echo "No report was produced. Check that VIRUSTOTAL_API_KEY is configured."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload VirusTotal reports
        if: always() && hashFiles('virustotal-report-*.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: virustotal-release-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: virustotal-report-*.json
          if-no-files-found: error
          retention-days: 90

  publish:
    name: publish / all platforms
    needs: build
    if: github.repository == 'vladelaina/BongoCat'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Download packaged releases
        uses: actions/download-artifact@v8
        with:
          pattern: bongocat-release-*
          path: release-output
          merge-multiple: true

      - name: Validate complete release
        id: version
        shell: pwsh
        run: |
          $projectVersion = & ./packaging/get-project-version.ps1
          $version = $projectVersion.AppVersion
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match project version $version"
          }
          $files = @()
          foreach ($platform in 'windows-x64', 'windows-x86') {
            $base = "BongoCat-$version-$platform"
            $files += "release-output/$base-portable.exe"
            $files += "release-output/$base-portable.exe.sha256"
            $files += "release-output/$base-setup.exe"
            $files += "release-output/$base-setup.exe.sha256"
          }
          $unixArchives = @{
            'linux-x64' = 'tar.gz'
            'macos-x64' = 'zip'
            'macos-arm64' = 'zip'
          }
          foreach ($platform in $unixArchives.Keys) {
            $archive = "release-output/BongoCat-$version-$platform.$($unixArchives[$platform])"
            $files += $archive
            $files += "$archive.sha256"
          }
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Release is incomplete: $file"
            }
          }
          foreach ($checksum in $files | Where-Object { $_ -like '*.sha256' }) {
            $line = (Get-Content -LiteralPath $checksum -Raw).Trim()
            if ($line -notmatch '^([0-9a-fA-F]{64})\s+(.+)$') {
              throw "Invalid checksum file: $checksum"
            }
            $expectedHash = $Matches[1]
            $checksumName = $Matches[2]
            $payload = $checksum.Substring(0, $checksum.Length - 7)
            $expectedName = Split-Path $payload -Leaf
            if ($checksumName -ne $expectedName) {
              throw "Checksum names the wrong file: $checksum"
            }
            $actual = (Get-FileHash -LiteralPath $payload -Algorithm SHA256).Hash
            if ($actual -ne $expectedHash) {
              throw "Checksum mismatch: $payload"
            }
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT `
            -Append -Encoding utf8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: BongoCat v${{ steps.version.outputs.version }}
          body: |
            ## Download

            <a href="https://apps.microsoft.com/detail/9p41mlsx72xw?referrer=appbadge" target="_self">
              <img src="https://get.microsoft.com/images/en-us%20light.svg" width="600"/>
            </a>

            ### GitHub Downloads

            - [Windows x64 installer](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/BongoCat-${{ steps.version.outputs.version }}-windows-x64-setup.exe)
            - [Windows x64 portable](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/BongoCat-${{ steps.version.outputs.version }}-windows-x64-portable.exe)
            - [Windows x86 installer](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/BongoCat-${{ steps.version.outputs.version }}-windows-x86-setup.exe)
            - [Windows x86 portable](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/BongoCat-${{ steps.version.outputs.version }}-windows-x86-portable.exe)
            - [macOS Apple Silicon](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/BongoCat-${{ steps.version.outputs.version }}-macos-arm64.zip)
            - [macOS Intel](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/BongoCat-${{ steps.version.outputs.version }}-macos-x64.zip)
            - [Linux x64](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/BongoCat-${{ steps.version.outputs.version }}-linux-x64.tar.gz)

          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: true
          files: |
            release-output/*-portable.exe
            release-output/*-setup.exe
            release-output/*.zip
            release-output/*.tar.gz
